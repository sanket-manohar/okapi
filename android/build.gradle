group = "dev.okapi.permissions"
version = "1.0.0"

buildscript {
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// AGP 9 can compile Kotlin by itself ("built-in Kotlin"). Apply the Kotlin
// plugin only when that is not active, so the plugin builds with AGP 7, 8
// and 9 alike.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
def builtInKotlinProperty = project.findProperty("android.builtInKotlin")?.toString()
def builtInKotlin = agpMajor >= 9 && builtInKotlinProperty != "false"
if (!builtInKotlin) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "dev.okapi.permissions"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
        consumerProguardFiles "consumer-rules.pro"
    }
}

// Match Kotlin's JVM target to Java's. Works with Kotlin 1.8 to 2.x.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    if (it.hasProperty("compilerOptions")) {
        it.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    } else {
        it.kotlinOptions.jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.13.1")
    // ListenableFuture used by PackageManagerCompat (auto-reset status).
    implementation("androidx.concurrent:concurrent-futures:1.1.0")
}
