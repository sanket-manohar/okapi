# Builds the Okapi example app APK on GitHub's servers (free for public repos).
# Run it: GitHub repo > Actions > "Build example APK" > Run workflow.
# Download it: open the finished run > Artifacts > okapi-example-apk.
name: Build example APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    name: Analyze and test the package
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed . || echo "::warning::Run 'dart format .' before publishing"
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project for the example
        working-directory: example
        run: |
          # Keeps the provided lib/main.dart, pubspec.yaml and AndroidManifest.xml.
          flutter create --platforms=android --org dev.okapi --project-name okapi_example .

      - name: Okapi Doctor (permission setup check)
        working-directory: example
        continue-on-error: true
        run: dart run okapi:doctor

      - name: Build release APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: okapi-example-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
